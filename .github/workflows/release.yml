name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v1.7.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Build executable
        run: python build.py

      - name: Smoke-test executable
        run: |
          # The exe is built --noconsole, so it detaches from the shell and its
          # stdout goes nowhere: the exit code has to come from the process
          # object and the detail from a report file. Start-Process resolves
          # relative paths against the process CWD rather than $PWD, so both
          # paths are absolute.
          $exe = Join-Path $PWD 'dist\Talkie.exe'
          $log = Join-Path $PWD 'selftest.log'
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest', $log -PassThru
          # A failed top-level import raises a blocking traceback dialog under
          # the windowed bootloader, which would otherwise hang the whole job.
          if (-not $p.WaitForExit(120000)) {
            $p.Kill()
            Write-Error "Self-test did not exit within 120s"
            exit 1
          }
          $p.WaitForExit()
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) {
            Write-Error "Self-test failed (exit $($p.ExitCode))"
            exit 1
          }
          Write-Host "Self-test passed"

      - name: Generate checksum
        run: |
          $hash = (Get-FileHash dist/Talkie.exe -Algorithm SHA256).Hash
          "$hash  Talkie.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Talkie
          path: dist/Talkie.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/Talkie.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
